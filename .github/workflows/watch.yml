# OWN BOOK watcher — runs the rule on GitHub's servers and pushes to your phone.
# Zero Claude usage. Free on a public repo. Every 30 minutes, and on demand from the Actions tab.
name: watch
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: prove the rule still matches the app
        run: node watch/test.js
      - name: run the rule and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node watch/watch.js
      - name: save state and the shared journal for the app and the next run
        run: |
          git config user.name  "own-book-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch/last.json kraken-journal.json
          git diff --cached --quiet || git commit -m "watch: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main || true
          git push
