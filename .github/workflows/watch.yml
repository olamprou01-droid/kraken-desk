# OWN BOOK watcher — runs the rule on GitHub's servers and pushes to your phone.
# Zero Claude usage. Free on a public repo (Actions minutes are unlimited there).
#
# 30 Sep 2026: GitHub fires a cron job every 2-7 h, not every 30 min (measured 4.4 h).
# So each job now LOOPS: it runs the rule every 5 minutes for up to 5h40m, committing
# state as it goes. The cron keeps the next job queued behind it (concurrency group),
# so when one ends the next starts - alerts arrive within 5 minutes, around the clock.
# A push to the app, the watcher or this file ends the running loop early and the
# pushed code takes over, so a deploy never waits and never runs stale.
name: watch
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths: ['index.html', 'watch/**', '.github/workflows/watch.yml']
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v5
      # A queued job checks out the commit from when it was QUEUED, not when it starts. A loop
      # job that waited 2.5 h behind the previous one started on 5 Oct 08:27 with 05:56 state and
      # sent the daily heartbeat twice - the same stale state could re-send alerts or overwrite
      # trades the previous job had merged. Always start from the newest commit.
      - name: start from the newest state and code
        run: git fetch -q origin main && git reset -q --hard origin/main && git log -1 --format='running on %h %s'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: prove the rule still matches the app
        run: node watch/test.js
      - name: prove the app still boots (every device auto-updates to it)
        run: |
          npm i --silent --no-audit --no-fund jsdom@24
          node watch/smoke.js
      - name: keep a known-good copy to roll back to
        # index.prev.html is only refreshed after the smoke test passed on the current file,
        # so it always holds the last version that booted.
        run: |
          cp index.html index.prev.html
          git config user.name  "own-book-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.prev.html
          git diff --cached --quiet || git commit -m "watch: rollback copy $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: run the rule every 5 minutes for the life of this job, notify, save as it goes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: node watch/watch.js --loop 340
      - name: save whatever the last pass left
        run: |
          git fetch -q origin main && git reset -q origin/main
          git add watch/last.json kraken-journal.json index.prev.html
          git diff --cached --quiet || (git commit -m "watch: $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q origin HEAD:main)
      - name: tell the phone if anything above failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          T="${NTFY_TOPIC:-ownbook-356ba5c8fc6a5b7454}"
          curl -s -o /dev/null -H "Title: WATCHER FAILED" -H "Priority: high" -H "Tags: rotating_light" \
            -d "Run #${{ github.run_number }} failed (test, smoke, watcher or push) · github.com/${{ github.repository }}/actions · the next cron job restarts it · index.prev.html is the last app that booted" \
            "https://ntfy.sh/$T"
